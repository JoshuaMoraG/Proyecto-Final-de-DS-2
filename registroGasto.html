<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login y Registro</title>
    <link rel="stylesheet" href="styles.css"><div class="container">
    <div class="form-box">
        <h2 id="title">Registrar Gasto</h2>

        <form id="form">
            <div class="input-group">
                <!-- Fecha -->
                <input type="date" id="fecha" required>
                
                <!-- Categoría -->
                <input type="text" id="categoria" list="categorias-gastos" placeholder="Categoría" required>
                
                <datalist id="categorias-gastos">
                    <option value="Alimentación" label="Gastos Variables">
                    <option value="Transporte" label="Gastos Fijos">
                    <option value="Entretenimiento" label="Gastos Variables">
                    <option value="Salud" label="Gastos Variables">
                </datalist>

                <!-- Descripción -->
                <input type="text" id="descripcion" placeholder="Descripción" required>
                
                <!-- Monto -->
                <input type="number" id="monto" placeholder="Monto" step="0.01" required>
            </div>

            <button type="submit" id="submitBtn">Registrar</button>
        </form>
    </div>
</div>
