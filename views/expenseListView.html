<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📋 My Expenses</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

    <div class="container">
        <div class="list-box">
            <h2>📋 Mis Gastos</h2>

            <div class="filtro-container">
                <label for="filter-category">Filtrar por categoría:</label>
                <select id="filter-category">
                   
                </select>

                <label for="filter-date-from">Desde:</label>
                <input type="date" id="filter-date-from">

                <label for="filter-date-to">Hasta:</label>
                <input type="date" id="filter-date-to">

                <label for="sort-by">Ordenar por:</label>
                <select id="sort-by">
                    <option value="">--</option>
                    <option value="date_asc">Fecha ↑</option>
                    <option value="date_desc">Fecha ↓</option>
                    <option value="amount_asc">Monto ↑</option>
                    <option value="amount_desc">Monto ↓</option>
                </select>
            </div>

            <div id="expense-list">
                <p class="no-data">Sin gastos registrados</p>
            </div>
        </div>
    </div>

    <script src="../controllers/layout.js"></script>
    <script src="../models/ExpenseRecordModel.js"></script>
    <script src="../controllers/listController.js"></script>

</body>
</html>
