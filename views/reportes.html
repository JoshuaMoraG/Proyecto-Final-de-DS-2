<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reportes de Gastos</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .reportes-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 100px;
        }

        .reportes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .reporte-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(0, 182, 248, 0.3);
        }

        .reporte-card h3 {
            color: #009999;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #ff99cc;
            padding-bottom: 10px;
        }

        .total-general {
            font-size: 36px;
            font-weight: bold;
            color: #009999;
            text-align: center;
            margin: 20px 0;
        }

        .categoria-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 8px 0;
            background: #f0f9ff;
            border-radius: 8px;
            border-left: 4px solid #009999;
        }

        .categoria-nombre {
            font-weight: bold;
            color: #333;
        }

        .categoria-monto {
            color: #009999;
            font-weight: bold;
            font-size: 18px;
        }

        .grafico-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(0, 182, 248, 0.3);
            margin-bottom: 30px;
        }

        .grafico-container h3 {
            color: #009999;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }

        .no-datos {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }

        .resumen-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #009999, #6BC2FF);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="reportes-container">
        <h1 style="text-align: center; color: white; margin-bottom: 30px;">📊 Reportes de Gastos</h1>

        <div id="contenido-reportes">
            <!-- Aquí se cargará dinámicamente el contenido -->
        </div>
    </div>

    <script src="../controllers/layout.js"></script>
    <script src="../models/RegistroGastoModel.js"></script>
    <script src="../models/ReportesModel.js"></script>
    <script src="../controllers/reportesController.js"></script>

</body>

</html>
